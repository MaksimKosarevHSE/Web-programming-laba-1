    <text x="300" y="781" font-size="68" font-weight="700" letter-spacing="5">ОРБИТА</text>
    <text x="300" y="824" font-size="12" letter-spacing="3" fill="#9db7dc">КОСМОС СЛЫШИТ КАЖДОГО</text>
    <text x="300" y="861" font-size="10" letter-spacing="3" fill="#707f9e">ФАНТАСТИКА · 126 МИН · 12+</text>
