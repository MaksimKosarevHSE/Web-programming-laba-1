    <circle cx="257" cy="174" r="1.2"/><circle cx="375" cy="106" r=".7"/><circle cx="493" cy="190" r="1.1"/>
    <circle cx="552" cy="86" r="1.5"/><circle cx="527" cy="332" r=".8"/><circle cx="421" cy="291" r="1.2"/>
    <circle cx="82" cy="431" r=".9"/><circle cx="540" cy="553" r="1"/><circle cx="54" cy="607" r="1.2"/>
  </g>
  <g fill="none" stroke="#a5d7ff" stroke-opacity=".16">
    <circle cx="300" cy="411" r="202"/><circle cx="300" cy="411" r="237"/>
  </g>
  <ellipse cx="300" cy="443" rx="250" ry="74" fill="none" stroke="url(#ring)" stroke-width="22" opacity=".33" filter="url(#halo)"/>
  <ellipse cx="300" cy="443" rx="250" ry="74" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".72"/>
  <circle cx="300" cy="411" r="137" fill="#a8cfff" opacity=".13" filter="url(#halo)"/>
  <circle cx="300" cy="411" r="128" fill="url(#planet)"/>
  <path d="M182 382c39-22 74-31 117-29 51 2 84 15 123 40" fill="none" stroke="#f3d8c9" stroke-opacity=".18" stroke-width="8"/>
  <path d="M192 456c75 26 144 22 214-11" fill="none" stroke="#16182d" stroke-opacity=".45" stroke-width="13"/>
  <ellipse cx="300" cy="443" rx="250" ry="74" clip-path="url(#frontHalf)" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="486" cy="385" r="5" fill="#e1f8ff"/>
  <path d="M486 385 523 348" stroke="#e1f8ff" stroke-width="1" stroke-dasharray="3 5" opacity=".65"/>
