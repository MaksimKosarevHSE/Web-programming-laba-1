      <stop offset=".27" stop-color="#d5f5ff" stop-opacity=".86"/>
      <stop offset=".7" stop-color="#c6a8ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#977eff" stop-opacity="0"/>
