<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Тихая орбита — киноафиша</title>
  <desc id="desc">Минималистичная планета с тонкими кольцами на глубоком космическом фоне.</desc>
  <defs>
    <radialGradient id="space" cx="55%" cy="35%" r="80%">
      <stop offset="0" stop-color="#162443"/>
      <stop offset=".5" stop-color="#090d1c"/>
      <stop offset="1" stop-color="#03040a"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="28%" r="75%">
      <stop offset="0" stop-color="#f1ded0"/>
      <stop offset=".32" stop-color="#b9919c"/>
      <stop offset=".7" stop-color="#525572"/>
      <stop offset="1" stop-color="#16182c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
